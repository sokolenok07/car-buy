<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выкуп автомобилей 24/7</title>

    <style>
        body {
            margin: 0;
            font-family: "Montserrat", Arial, sans-serif;
            background: #f2f2f2;
            color: #222;
        }

        /* ====== HEADER ====== */
        header {
            width: 100%;
            padding: 15px 25px;
            background: #111;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .header-links a {
            margin-left: 12px;
            text-decoration: none;
            color: white;
            font-size: 18px;
            padding: 8px 12px;
            border-radius: 6px;
            background: #2e2e2e;
            transition: 0.2s;
        }

        .header-links a:hover {
            background: #3CB371;
        }

        /* ====== HERO SECTION ====== */
        .hero {
            margin-top: 70px;
            background: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)),
                        url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=1500&q=80');
            background-size: cover;
            background-position: center;
            padding: 140px 25px;
            color: white;
        }

        .hero h1 {
            font-size: 50px;
            margin-bottom: 15px;
            font-weight: 700;
            max-width: 500px;
        }

        .hero p {
            font-size: 22px;
            opacity: 0.9;
            max-width: 400px;
            line-height: 1.5;
        }

        /* ====== FORM ====== */
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .form-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h2 {
            text-align: center;
            margin-top: 0;
            font-size: 26px;
        }

        input, textarea {
            width: 100%;
            margin: 10px 0;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            width: 100%;
            background: #3CB371;
            color: white;
            padding: 16px;
            border-radius: 8px;
            border: none;
            font-size: 18px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        button:hover {
            background: #34a164;
        }

        /* ====== FOOTER ====== */
        footer {
            margin-top: 50px;
            padding: 25px;
            background: #111;
            color: white;
            text-align: center;
        }

        /* ====== MOBILE ====== */
        @media(max-width: 700px) {
            .hero h1 { font-size: 34px; }
            .hero p { font-size: 18px; }
        }
    </style>
</head>
<body>

<!-- HEADER -->
<header>
    <div class="logo">Выкуп авто 24/7</div>

    <div class="header-links">
        <a href="https://wa.me/79990000000">WA</a>
        <a href="https://t.me/username">TG</a>
        <a href="tel:+79990000000">📞</a>
    </div>
</header>

<!-- HERO -->
<div class="hero">
    <h1>Срочный выкуп автомобилей</h1>
    <p>Оценка за 5 минут • Работаем 24/7 • Приезжаем быстро • Дороже перекупов</p>
</div>

<!-- FORM -->
<div class="container">
    <div class="form-box">
        <h2>Оставить заявку</h2>

        <form action="https://formspree.io/f/XXXXXXXX" method="POST">
            <input type="text" name="name" placeholder="Ваше имя" required>
            <input type="tel" name="phone" placeholder="Телефон" required>
            <input type="text" name="car" placeholder="Марка и модель авто" required>
            <textarea name="details" rows="4" placeholder="Год, состояние, пробег"></textarea>
            <button type="submit">Отправить</button>
        </form>
    </div>
</div>

<footer>
    © 2025 • Срочный выкуп авто • Работаем круглосуточно
</footer>

</body>
</html>
