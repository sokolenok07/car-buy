<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выкуп автомобилей — Быстро и Дорого</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }
        header {
            background: #111;
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }
        h1, h2 {
            text-align: center;
        }
        form {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        input, textarea, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 15px;
        }
        button {
            background: #111;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
        }
        .buttons {
            text-align: center;
            margin-top: 20px;
        }
        .buttons a {
            display: inline-block;
            padding: 12px 20px;
            margin: 5px;
            color: #fff;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }
        .wa { background: #25D366; }
        .tg { background: #0088cc; }
        .call { background: #000; }
        footer {
            text-align: center;
            padding: 20px;
            background: #111;
            color: #fff;
            margin-top: 40px;
        }
    </style>
</head>
<body>

<header>
    <h1>Срочный выкуп автомобилей</h1>
    <p>Приедем за 20 минут • Оплата сразу • Любое состояние</p>
</header>

<div class="container">

    <h2>Оставить заявку на выкуп авто</h2>

    <!-- Форма отправки через Formspree (бесплатно) -->
    <form action="https://formspree.io/f/XXXXXXXX" method="POST">
        <input type="text" name="name" placeholder="Ваше имя" required>
        <input type="tel" name="phone" placeholder="Телефон" required>
        <input type="text" name="car" placeholder="Марка и модель авто" required>
        <textarea name="details" placeholder="Год выпуска, состояние и т.д." rows="4"></textarea>
        <button type="submit">Отправить заявку</button>
    </form>

    <div class="buttons">
        <a href="https://wa.me/79990000000" class="wa">Написать в WhatsApp</a>
        <a href="https://t.me/username" class="tg">Написать в Telegram</a>
        <a href="tel:+79990000000" class="call">Позвонить</a>
    </div>

</div>

<footer>
    © 2025 | Срочный выкуп авто • Работаем 24/7
</footer>

</body>
</html>
